name: HP Omen Stock Tracker

on:
  schedule:
    - cron: "*/15 * * * *"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hp-omen-stock-tracker
  cancel-in-progress: false

jobs:
  check-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install curl-cffi beautifulsoup4

      - name: Restore tracker state
        uses: actions/cache@v4
        with:
          path: state.json
          key: omen-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            omen-state-

      - name: Run Omen tracker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tracker.py

      - name: Upload debug HTML if tracker fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hepsiburada-debug-${{ github.run_id }}
          path: hepsiburada_debug.html
          if-no-files-found: ignore
          retention-days: 3
